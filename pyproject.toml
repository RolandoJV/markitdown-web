[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-web"
dynamic = ["version"]
description = "Unofficial web UI for the markitdown library (upload multiple files, preview and download Markdown)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
keywords = ["markitdown", "markdown", "converter", "web"]
dependencies = [
  "markitdown[all]>=0.1.1,<0.2.0",
  "fastapi>=0.110,<1.0.0",
  "uvicorn>=0.27,<1.0.0",
  "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.urls]
Documentation = "https://github.com/microsoft/markitdown#readme"
Issues = "https://github.com/microsoft/markitdown/issues"
Source = "https://github.com/microsoft/markitdown"

[project.scripts]
markitdown-web = "markitdown_web.__main__:main"

[tool.hatch.version]
path = "src/markitdown_web/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_web"]

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_web", "README.md", "LICENSE", "THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
